# 로컬 실행용 구성. `docker compose up` 한 번으로 앱 + MariaDB + Redis 가 뜬다.
#
# .env 가 없어도 뜨도록 로컬 전용 기본값을 여기 둔다. 실제 카카오 로그인·메일 발송·공공데이터
# 동기화·챗봇처럼 외부 키가 필요한 기능만 .env 로 덮어쓴다(.env.example 참고).
# 여기 있는 기본값은 운영에서 쓰면 안 된다. 운영은 이 파일을 쓰지 않는다.
#
#   전부:           docker compose up --build
#   DB·Redis 만:    docker compose up mariadb redis     (앱은 IDE / ./gradlew bootRun)

name: carecode

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: carecode
      MARIADB_USER: carecode
      MARIADB_PASSWORD: ${DB_PASSWORD:-carecode-local}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-carecode-root-local}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 운영(Linux MariaDB)과 같게. 테이블 이름 대소문자를 구분해야 대문자 매핑 불일치가 여기서 잡힌다.
      - --lower-case-table-names=0
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8082}:8082"
    env_file:
      - path: .env
        required: false
    environment:
      # dev 프로파일(Swagger 공개, 상세 로그)에 스키마만 운영과 같은 방식으로 만든다.
      # dev 기본은 ddl-auto=update 라 마이그레이션이 틀려도 Hibernate 가 테이블을 만들어 버린다.
      # 여기서는 Flyway 로 만들고 Hibernate 는 검증만 해서, 로컬에서도 마이그레이션 누락이 기동 실패로 드러난다.
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      DB_URL: jdbc:mariadb://mariadb:3306/carecode
      DB_USERNAME: carecode
      DB_PASSWORD: ${DB_PASSWORD:-carecode-local}
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # 로컬 전용 값. 32자 이상이어야 기동된다.
      JWT_SECRET: ${JWT_SECRET:-local-only-jwt-secret-do-not-use-in-production-0123456789}
      JWT_REFRESH_TOKEN_STORE: redis

      # 외부 연동. 비워 두거나 가짜 값이어도 기동은 된다 — 해당 기능만 동작하지 않는다.
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-local-kakao-client-id}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-local-kakao-client-secret}
      MAIL_USERNAME: ${MAIL_USERNAME:-local@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-local-mail-password}
      PUBLIC_DATA_API_KEY: ${PUBLIC_DATA_API_KEY:-local-public-data-key}
      EMAIL_VERIFICATION_BASE_URL: ${EMAIL_VERIFICATION_BASE_URL:-http://localhost:8082}

      # 프런트(CareCode_FE, 3000번)에서 붙을 수 있게. 로컬에서는 쿠키를 http 로도 주고받아야 한다.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAME_SITE: ${REFRESH_COOKIE_SAME_SITE:-Lax}

      STORAGE_ROOT: /app/uploads

      # `SEED_SAMPLE_DATA=true docker compose up` 처럼 셸에서 넘긴 값이 컨테이너까지 가도록 명시한다.
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}

      # 업로드 악성코드 검사. `STORAGE_SCAN_ENABLED=true docker compose --profile scan up` 으로 clamav 와 함께 켠다.
      STORAGE_SCAN_ENABLED: ${STORAGE_SCAN_ENABLED:-false}
      CLAMD_HOST: ${CLAMD_HOST:-clamav}
    volumes:
      - uploads:/app/uploads

  # 선택: 업로드 악성코드 검사기. 시그니처 DB 를 받느라 첫 기동에 몇 분 걸리고 메모리를 1GB 넘게 쓴다.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    ports:
      - "${CLAMD_PORT:-3310}:3310"

volumes:
  mariadb-data:
  uploads:
