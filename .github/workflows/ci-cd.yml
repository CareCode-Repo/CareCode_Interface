name: CI/CD Pipeline - Blue/Green Deployment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 헬스 URL 은 전역 env 에서 뺐다. 배포 잡의 해당 스텝만 시크릿을 env 로 받는다.
  # 전역에 두면 배포와 무관한 test/scan 잡 환경에까지 값이 실린다.

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: carecode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================
  # Test & Build Job
  # ===========================================
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 이 잡은 SSH 를 사용하지 않는다. PR 트리거에서도 도는 잡에
    # 배포용 개인키를 올리지 않도록 SSH 설정을 두지 않는다.

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Run tests
      run: ./gradlew clean test jacocoTestReport

    # Testcontainers 테스트는 Docker 가 없으면 조용히 skip 되고 빌드는 초록불이 된다.
    # 스키마 정합성 검증이 그렇게 빠지면 마이그레이션 누락을 아무도 못 잡는다.
    - name: Assert schema validation actually ran
      run: |
        report=build/test-results/test/TEST-com.carecode.integration.FlywaySchemaValidationTest.xml
        if [ ! -f "$report" ]; then
          echo "::error::스키마 정합성 테스트 리포트가 없습니다."
          exit 1
        fi
        if grep -q 'skipped="0"' "$report"; then
          echo "스키마 정합성 테스트 실행 확인"
        else
          echo "::error::스키마 정합성 테스트가 skip 되었습니다. Docker 환경을 확인하세요."
          exit 1
        fi

    - name: Publish test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: 'build/test-results/test/TEST-*.xml'

    # build 에서 -x test 로 테스트를 빼면 check 에 걸어둔 커버리지 검증까지 함께 무력화된다.
    # 위에서 이미 test 를 돌렸으므로 여기서는 검증을 포함해 그대로 build 한다.
    - name: Build application
      run: ./gradlew build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: application-jar
        path: build/libs/*.jar
        retention-days: 7

  # ===========================================
  # Security Scan Job
  # ===========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test-and-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 이 잡도 SSH 를 사용하지 않으므로 배포용 개인키를 로드하지 않는다.

    # 1) SARIF 리포트 생성 (Security 탭 업로드용) - 여기서는 실패시키지 않는다.
    - name: Run Trivy vulnerability scanner (report)
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    # 2) 게이트: CRITICAL/HIGH 취약점이 있으면 파이프라인을 실패시킨다.
    #    exit-code 를 지정하지 않으면 취약점이 나와도 그냥 통과해 스캔이 장식이 된다.
    - name: Fail on CRITICAL/HIGH vulnerabilities
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        ignore-unfixed: true
        exit-code: '1'

  # ===========================================
  # Build Docker Image Job
  # ===========================================
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    outputs:
      image-tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ===========================================
  # Deploy to Staging (Green) Job
  # ===========================================
  deploy-staging:
    name: Deploy to Staging (Green)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 어떤 시크릿이 비어 있는지 먼저 이름으로 알려준다.
    # 예전에는 `test -n "..."` 하나로 끝나서, 실패해도 무엇이 없는지 로그에 남지 않았다.
    - name: Check required secrets
      env:
        DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
        SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
      run: |
        missing=""
        for name in DEPLOY_HOST DEPLOY_USER SSH_KEY HEALTH_URL; do
          if [ -z "${!name}" ]; then missing="$missing STAGING_$name"; fi
        done
        if [ -n "$missing" ]; then
          echo "::error::스테이징 배포에 필요한 시크릿이 없습니다:$missing"
          exit 1
        fi
        echo "필요한 시크릿이 모두 설정되어 있습니다."

    # SSH 개인키를 올리는 스텝이 아예 없어서, 시크릿을 채워도 인증 단계에서 막혔다.
    # 키는 env 로 넘긴다. run 본문에 ${{ secrets.* }} 를 그대로 쓰면 값이 스크립트 텍스트에 박힌다.
    - name: Set up SSH
      env:
        SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
      run: |
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        if [ -n "$KNOWN_HOSTS" ]; then
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        else
          # StrictHostKeyChecking=no 를 쓰던 자리다. keyscan 도 최초 접속을 그냥 믿는 건 같지만,
          # 최소한 이번 실행 안에서는 호스트키가 고정된다. 중간자 공격까지 막으려면
          # STAGING_SSH_KNOWN_HOSTS 에 호스트키를 넣어 고정해야 한다.
          echo "::warning::STAGING_SSH_KNOWN_HOSTS 가 없어 ssh-keyscan 으로 대체합니다."
          ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
        fi
        chmod 600 ~/.ssh/known_hosts

    - name: Deploy to staging environment
      env:
        DEPLOY_HOST: ${{ secrets.STAGING_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.STAGING_DEPLOY_USER }}
        IMAGE: ${{ needs.build-docker.outputs.image-tag }}
      run: |
        ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
          "docker pull $IMAGE && (docker stop carecode-staging || true) && (docker rm carecode-staging || true) && docker run -d --name carecode-staging -p 8082:8082 --env-file /opt/carecode/.env $IMAGE"

    - name: Run health check
      env:
        HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
      run: |
        for i in {1..20}; do
          if curl -fsS "$HEALTH_URL/actuator/health" | grep -q '"status":"UP"'; then
            echo "Staging health check passed"
            exit 0
          fi
          sleep 5
        done
        echo "::error::스테이징 헬스체크 실패 - 컨테이너 로그를 확인하세요"
        exit 1

    # 예전에는 echo 만 있어서 배포가 실패해도 아무에게도 닿지 않았다.
    # OPS_SLACK_WEBHOOK_URL 이 없으면 잡 요약에만 남긴다.
    - name: Notify deployment status
      if: always()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.OPS_SLACK_WEBHOOK_URL }}
        STATUS: ${{ job.status }}
      run: |
        line="[staging] 배포 $STATUS - ${{ github.repository }}@${GITHUB_SHA:0:7} (${{ github.run_id }})"
        echo "$line" >> "$GITHUB_STEP_SUMMARY"
        if [ "$STATUS" != "success" ]; then echo "::error::$line"; fi
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$line" '{text:$t}')" || echo "::warning::슬랙 알림 전송 실패"
        fi

  # ===========================================
  # Deploy to Production (Blue/Green) Job
  # ===========================================
  deploy-production:
    name: Deploy to Production (Blue/Green)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 어떤 시크릿이 비어 있는지 먼저 이름으로 알려준다.
    # 예전에는 각 스텝의 `test -n "..."` 하나로 끝나서, 실패해도 무엇이 없는지 로그에 남지 않았다.
    - name: Check required secrets
      env:
        DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
        SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        ROUTER_STATUS_URL: ${{ secrets.PRODUCTION_ROUTER_STATUS_URL }}
        ROUTER_SWITCH_URL: ${{ secrets.PRODUCTION_ROUTER_SWITCH_URL }}
        ROUTER_TOKEN: ${{ secrets.PRODUCTION_ROUTER_TOKEN }}
        TARGET_HEALTH_URL_TEMPLATE: ${{ secrets.PRODUCTION_TARGET_HEALTH_URL_TEMPLATE }}
      run: |
        missing=""
        for name in DEPLOY_HOST DEPLOY_USER SSH_KEY HEALTH_URL \
                    ROUTER_STATUS_URL ROUTER_SWITCH_URL ROUTER_TOKEN TARGET_HEALTH_URL_TEMPLATE; do
          if [ -z "${!name}" ]; then missing="$missing PRODUCTION_$name"; fi
        done
        if [ -n "$missing" ]; then
          echo "::error::운영 배포에 필요한 시크릿이 없습니다:$missing"
          exit 1
        fi
        echo "필요한 시크릿이 모두 설정되어 있습니다."

    # SSH 개인키를 올리는 스텝이 아예 없어서, 시크릿을 채워도 인증 단계에서 막혔다.
    # 키는 env 로 넘긴다. run 본문에 ${{ secrets.* }} 를 그대로 쓰면 값이 스크립트 텍스트에 박힌다.
    - name: Set up SSH
      env:
        SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
      run: |
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        if [ -n "$KNOWN_HOSTS" ]; then
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        else
          # StrictHostKeyChecking=no 를 쓰던 자리다. keyscan 도 최초 접속을 그냥 믿는 건 같지만,
          # 최소한 이번 실행 안에서는 호스트키가 고정된다. 중간자 공격까지 막으려면
          # PRODUCTION_SSH_KNOWN_HOSTS 에 호스트키를 넣어 고정해야 한다.
          echo "::warning::PRODUCTION_SSH_KNOWN_HOSTS 가 없어 ssh-keyscan 으로 대체합니다."
          ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
        fi
        chmod 600 ~/.ssh/known_hosts

    # blue/green 두 컨테이너는 서로 다른 포트를 점유해야 한다.
    # 둘 다 8082 를 쓰면 동시에 뜰 수 없어 무중단 전환 자체가 성립하지 않는다.
    - name: Determine deployment strategy
      id: strategy
      env:
        ROUTER_STATUS_URL: ${{ secrets.PRODUCTION_ROUTER_STATUS_URL }}
      run: |
        CURRENT_ENV=$(curl -fsS "$ROUTER_STATUS_URL" || echo "blue")
        if [ "$CURRENT_ENV" = "blue" ]; then
          echo "target-env=green"  >> $GITHUB_OUTPUT
          echo "current-env=blue"  >> $GITHUB_OUTPUT
          echo "target-port=8083"  >> $GITHUB_OUTPUT
        else
          echo "target-env=blue"   >> $GITHUB_OUTPUT
          echo "current-env=green" >> $GITHUB_OUTPUT
          echo "target-port=8082"  >> $GITHUB_OUTPUT
        fi
        echo "현재 $CURRENT_ENV → 대상 $([ "$CURRENT_ENV" = "blue" ] && echo green || echo blue)"

    - name: Deploy to target environment
      env:
        DEPLOY_HOST: ${{ secrets.PRODUCTION_DEPLOY_HOST }}
        DEPLOY_USER: ${{ secrets.PRODUCTION_DEPLOY_USER }}
        IMAGE: ${{ needs.build-docker.outputs.image-tag }}
        TARGET: ${{ steps.strategy.outputs.target-env }}
        PORT: ${{ steps.strategy.outputs.target-port }}
      run: |
        ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
          "docker pull $IMAGE \
           && (docker stop carecode-$TARGET || true) \
           && (docker rm carecode-$TARGET || true) \
           && docker run -d --name carecode-$TARGET -p $PORT:8082 --env-file /opt/carecode/.env $IMAGE"

    # 전환 전에는 아직 라우팅되지 않는 대기(target) 인스턴스를 직접 확인해야 한다.
    # 공용 헬스 URL 을 보면 구버전이 UP 이라 항상 통과해버린다.
    - name: Wait for target instance to be ready
      env:
        TARGET_HEALTH_URL_TEMPLATE: ${{ secrets.PRODUCTION_TARGET_HEALTH_URL_TEMPLATE }}
        PORT: ${{ steps.strategy.outputs.target-port }}
      run: |
        TARGET_HEALTH_URL=$(echo "$TARGET_HEALTH_URL_TEMPLATE" | sed "s/{port}/$PORT/")
        for i in {1..20}; do
          if curl -fsS "$TARGET_HEALTH_URL/actuator/health" | grep -q '"status":"UP"'; then
            echo "Production target ($PORT) is healthy"
            exit 0
          fi
          sleep 5
        done
        echo "::error::대상 인스턴스($PORT)가 뜨지 않았습니다. 트래픽은 전환하지 않습니다."
        exit 1

    # id 를 붙이는 이유는 아래 롤백이 "전환이 실제로 일어났을 때만" 돌게 하기 위해서다.
    - name: Switch traffic to new environment
      id: switch
      env:
        ROUTER_SWITCH_URL: ${{ secrets.PRODUCTION_ROUTER_SWITCH_URL }}
        ROUTER_TOKEN: ${{ secrets.PRODUCTION_ROUTER_TOKEN }}
        TARGET: ${{ steps.strategy.outputs.target-env }}
      run: |
        curl -fsS -X POST "$ROUTER_SWITCH_URL" \
          -H "Authorization: Bearer $ROUTER_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg t "$TARGET" '{target:$t}')"

    - name: Verify deployment
      env:
        HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
      run: |
        curl -fsS "$HEALTH_URL/actuator/health" | grep -q '"status":"UP"'

    # 전환이 성공한 뒤에 실패했을 때만 되돌린다.
    # 예전에는 조건이 failure() 뿐이라, 배포·헬스체크 단계에서 죽어 트래픽이 움직인 적도 없는데
    # 롤백을 시도했고, 그 스텝마저 실패해 로그에 실패가 두 번 찍혔다.
    - name: Rollback if needed
      if: failure() && steps.switch.outcome == 'success'
      env:
        ROUTER_SWITCH_URL: ${{ secrets.PRODUCTION_ROUTER_SWITCH_URL }}
        ROUTER_TOKEN: ${{ secrets.PRODUCTION_ROUTER_TOKEN }}
        CURRENT: ${{ steps.strategy.outputs.current-env }}
      run: |
        echo "::warning::전환 후 검증에 실패했습니다. $CURRENT 로 되돌립니다."
        curl -fsS -X POST "$ROUTER_SWITCH_URL" \
          -H "Authorization: Bearer $ROUTER_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$(jq -n --arg t "$CURRENT" '{target:$t}')"

    # 예전에는 echo 만 있어서 배포가 실패해도 아무에게도 닿지 않았다.
    # OPS_SLACK_WEBHOOK_URL 이 없으면 잡 요약에만 남긴다.
    - name: Notify deployment status
      if: always()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.OPS_SLACK_WEBHOOK_URL }}
        STATUS: ${{ job.status }}
        TARGET: ${{ steps.strategy.outputs.target-env }}
      run: |
        line="[production] 배포 $STATUS - ${{ github.repository }}@${GITHUB_SHA:0:7} → ${TARGET:-?} (${{ github.run_id }})"
        echo "$line" >> "$GITHUB_STEP_SUMMARY"
        if [ "$STATUS" != "success" ]; then echo "::error::$line"; fi
        if [ -n "$SLACK_WEBHOOK_URL" ]; then
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$line" '{text:$t}')" || echo "::warning::슬랙 알림 전송 실패"
        fi

  # ===========================================
  # Cleanup Job
  # ===========================================
  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always()
    
    steps:
    - name: Cleanup old images
      run: |
        echo "Cleaning up old Docker images"
        # 오래된 Docker 이미지 정리
        
    - name: Cleanup old deployments
      run: |
        echo "Cleaning up old deployments"
        # 오래된 배포 정리 