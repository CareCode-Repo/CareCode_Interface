spring:
  application:
    name: CareCode

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  # Spring Batch: 기동 시 잡 자동 실행 비활성화
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

  # Redis (Boot 3 정식 키는 spring.data.redis.*)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/carecode}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jpa:
    hibernate:
      naming:
        # 엔티티가 @Table 로 대문자 이름을 명시하는데, Boot 기본 전략은 이를 소문자로 바꾼다.
        # Linux MariaDB 는 lower_case_table_names=0 이라 대소문자를 구분해 전 테이블이 검증 실패한다.
        # 테이블만 선언한 그대로 쓰고 컬럼은 기존처럼 snake_case 로 변환한다.
        physical-strategy: com.carecode.core.config.CareCodeNamingStrategy

    database-platform: org.hibernate.dialect.MariaDBDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: profile,email
          # Kakao: 실제 로그인 흐름은 REST(POST /auth/kakao/login + KakaoUtil)다.
          # 아래 registration 은 클라이언트 자격증명 제공용이며 oauth2Login() 은 활성화하지 않는다.
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            scope: profile_nickname,profile_image
            client-name: Kakao
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /
  # 리버스 프록시 뒤에서 클라이언트 IP/프로토콜을 복원한다 (rate limit 정확도에 필요).
  forward-headers-strategy: framework

app:
  api:
    base-url: /api/v1
    version: v1
    title: 맘편한 API
    description: 육아 지원 플랫폼 맘편한의 REST API
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  auth:
    refresh-cookie:
      # 리프레시 토큰을 HttpOnly 쿠키로 내려 XSS 로 세션이 통째로 털리는 것을 막는다.
      # 프런트가 다른 오리진에 있으므로 기본값은 SameSite=None + Secure 다.
      # (브라우저는 localhost 를 보안 컨텍스트로 취급하므로 로컬 개발에서도 그대로 동작한다)
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:None}
      max-age-days: ${REFRESH_COOKIE_MAX_AGE_DAYS:14}
  benefit-report:
    # 같은 값을 이만큼 받으면 금액을 확정한다
    consensus-threshold: ${BENEFIT_CONSENSUS_THRESHOLD:3}
    # 대상 연령이 지난 뒤 이 기간 안에 있는 사람에게만 묻는다
    ask-within-months: ${BENEFIT_ASK_WITHIN_MONTHS:6}
    max-asks-per-user: ${BENEFIT_MAX_ASKS_PER_USER:1}

  policy-change:
    batch-size: ${POLICY_CHANGE_BATCH_SIZE:200}
    max-per-user: ${POLICY_CHANGE_MAX_PER_USER:3}

  geocoding:
    # 어린이집 API 는 좌표를 주지 않아 주소로 보정한다. 키가 없으면 보정을 건너뛴다
    kakao:
      # 카카오는 OAuth client_id 가 곧 REST API 키다. 별도 발급 없이 재사용한다.
      # 단, 개발자센터에서 해당 앱의 "카카오맵" 사용 설정이 켜져 있어야 한다.
      rest-api-key: ${KAKAO_REST_API_KEY:${KAKAO_CLIENT_ID:}}
    batch-size: ${GEOCODING_BATCH_SIZE:500}
    delay-ms: ${GEOCODING_DELAY_MS:100}

  ops:
    # 동기화 실패·처리되지 않은 예외를 알린다. 비워두면 로그만 남는다
    slack-webhook-url: ${OPS_SLACK_WEBHOOK_URL:}

  rate-limit:
    # 신뢰할 수 있는 프록시 뒤에 있을 때만 X-Forwarded-For 를 사용한다.
    # 프록시가 없는데 true 로 두면 헤더 위조로 rate limit 을 우회할 수 있다.
    trust-forwarded-headers: ${RATE_LIMIT_TRUST_XFF:false}
  storage:
    # 다중 인스턴스로 확장할 때는 FileStorageService 의 S3 구현체로 교체한다.
    local:
      root: ${STORAGE_ROOT:./uploads}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:/files}
    max-file-size-bytes: ${STORAGE_MAX_FILE_SIZE:10485760}
  notification:
    # 알림에서 앱 화면으로 이동하는 스킴. 클릭 집계 후 이 주소로 리다이렉트한다
    deep-link-base: ${NOTIFICATION_DEEP_LINK_BASE:carecode://}
    fcm:
      # 서비스 계정 JSON 경로 (예: file:/opt/carecode/fcm-service-account.json).
      # 비워두면 푸시 발송이 비활성화된다.
      credentials-location: ${FCM_CREDENTIALS_LOCATION:}
    sms:
      enabled: ${SMS_ENABLED:false}
  chatbot:
    claude:
      # 비워두면 챗봇이 규칙 기반 응답으로 동작한다 (로컬/CI 에서 키 없이 기동 가능).
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${CHATBOT_MODEL:claude-opus-5}
      max-tokens: ${CHATBOT_MAX_TOKENS:1024}
  community:
    # 이 횟수 이상 신고되면 관리자 확인 전까지 자동으로 숨긴다.
    auto-hide-report-threshold: ${COMMUNITY_AUTO_HIDE_THRESHOLD:5}
  scheduler:
    vaccination:
      cron: ${VACCINATION_REMINDER_CRON:0 0 9 * * *}
      reminder-days-before: ${VACCINATION_REMINDER_DAYS:7}
    booking:
      cron: ${BOOKING_REMINDER_CRON:0 0 18 * * *}
    cleanup:
      cron: ${CLEANUP_CRON:0 0 4 * * *}
    public-data:
      # 시설 정보는 변동이 잦지 않아 주 1회, 정책은 신청 기간이 있어 매일 확인한다.
      facility-cron: ${PUBLIC_DATA_FACILITY_CRON:0 0 3 * * MON}
      kindergarten-cron: ${PUBLIC_DATA_KINDERGARTEN_CRON:0 0 4 * * MON}
      benefit-cron: ${PUBLIC_DATA_BENEFIT_CRON:0 30 3 * * *}
      hospital-cron: ${PUBLIC_DATA_HOSPITAL_CRON:0 0 3 * * TUE}
      # 동기화가 끝난 뒤 돌아야 새로 들어온 시설이 대상에 포함된다
      geocoding-cron: ${PUBLIC_DATA_GEOCODING_CRON:0 0 5 * * *}
      # 알림은 새벽이 아니라 사람이 볼 시간에 보낸다
      policy-change-cron: ${PUBLIC_DATA_POLICY_CHANGE_CRON:0 0 9 * * *}
      # 제보 요청은 매일 보내면 소음이 된다
      report-ask-cron: ${BENEFIT_REPORT_ASK_CRON:0 0 10 * * WED}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:carecode}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000} # 1시간
  refresh-token:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000} # 30일
    # none: JWT 서명만 검증. redis: 리프레시 토큰을 Redis에 등록·회전·로그아웃 시 일괄 폐기.
    store: ${JWT_REFRESH_TOKEN_STORE:none}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /api-docs
  packages-to-scan: com.carecode
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    # 메일은 부가 기능이라 SMTP 가 막히면 헬스체크가 통째로 DOWN 이 되고
    # 로드밸런서가 멀쩡한 인스턴스를 내려버린다. 발송 실패는 알림 쪽에서 따로 잡는다.
    mail:
      enabled: false

kakao:
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/kakao/callback}

public:
  data:
    # 레거시 키 (서울 열린데이터광장 전용 CareFacilityApiService 가 참조)
    api:
      key: ${PUBLIC_DATA_API_KEY}
      base-url: ${PUBLIC_DATA_API_BASE_URL:http://openapi.seoul.go.kr:8088}

    # 서울 열린데이터광장 — 경로 파라미터 방식
    seoul:
      api-key: ${SEOUL_OPEN_DATA_KEY:${PUBLIC_DATA_API_KEY:}}
      base-url: ${SEOUL_OPEN_DATA_BASE_URL:http://openapi.seoul.go.kr:8088}

    # 공공데이터포털(data.go.kr) — serviceKey 쿼리 파라미터 방식.
    # 비워두면 해당 공급자를 쓰는 동기화가 건너뛰어진다(기동에는 영향 없음).
    datagokr:
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
      base-url: ${DATA_GO_KR_BASE_URL:https://apis.data.go.kr}

    # 보육통합정보시스템 — data.go.kr 이 아닌 별도 시스템. 인증 파라미터명이 다르다
    childcare-portal:
      service-key: ${CHILDCARE_PORTAL_KEY:}
      base-url: ${CHILDCARE_PORTAL_BASE_URL:https://api.childcare.go.kr}
      # 명세서와 다르면 코드가 아니라 여기를 고친다
      key-param: ${CHILDCARE_PORTAL_KEY_PARAM:key}
      page-param: ${CHILDCARE_PORTAL_PAGE_PARAM:}
      size-param: ${CHILDCARE_PORTAL_SIZE_PARAM:}

    # 유치원알리미 — 시군구 단위 조회, JSON. 정원·위경도는 basicInfo2 에만 있다
    kindergarten-info:
      service-key: ${KINDERGARTEN_INFO_KEY:}
      base-url: ${KINDERGARTEN_INFO_BASE_URL:https://e-childschoolinfo.moe.go.kr}

    # 심평원 병원정보서비스
    hospital:
      # 진료과목 코드. 심평원 코드표 기준 소아청소년과는 "10".
      # 코드가 개정될 수 있어 설정으로 뺀다.
      pediatric-subject-code: ${HOSPITAL_PEDIATRIC_SUBJECT_CODE:10}
      subject-name: ${HOSPITAL_SUBJECT_NAME:소아청소년과}

    # 데이터셋 경로. 공공데이터 오퍼레이션은 개편되므로 재배포 없이 바꿀 수 있게 뺀다.
    # 절대 URL 을 넣으면 base-url 대신 그대로 호출한다(표준데이터는 호스트가 다르다).
    resource:
      childcare: ${PUBLIC_DATA_RESOURCE_CHILDCARE:https://api.childcare.go.kr/mediate/rest/cpmsapi021/cpmsapi021/request}
      kindergarten: ${PUBLIC_DATA_RESOURCE_KINDERGARTEN:https://e-childschoolinfo.moe.go.kr/api/notice/basicInfo2.do}
      benefit: ${PUBLIC_DATA_RESOURCE_BENEFIT:https://api.odcloud.kr/api/gov24/v3/serviceList}
      hospital: ${PUBLIC_DATA_RESOURCE_HOSPITAL:B551182/hospInfoServicev2/getHospBasisList}

    sync:
      # 무한 루프 방지 상한. 도달하면 중단 사유를 남긴다.
      max-pages: ${PUBLIC_DATA_SYNC_MAX_PAGES:200}
