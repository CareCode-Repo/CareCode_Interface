# prod 프로파일: 공통 설정은 application.yml 에 있고, 여기에는 차이만 둔다.
spring:
  flyway:
    enabled: true

  jpa:
    hibernate:
      # 스키마 변경은 Flyway 마이그레이션으로만 수행한다.
      ddl-auto: validate
    show-sql: false

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}

# 운영에서는 API 문서를 노출하지 않는다.
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: WARN
    com.carecode: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
