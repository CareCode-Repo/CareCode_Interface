# dev 프로파일: 공통 설정은 application.yml 에 있고, 여기에는 차이만 둔다.
spring:
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        generate_statistics: true

app:
  # 공공데이터 연동 전 거주지 비교·입소 예측·인기도를 확인하기 위한 샘플 데이터.
  # 실제 지원 금액이 아니므로 검증이 끝나면 DELETE /api/admin/dev/sample-data 로 지운다.
  dev:
    seed-sample-data: ${SEED_SAMPLE_DATA:false}

  monitoring:
    query-count:
      enabled: true
      threshold: 20

springdoc:
  swagger-ui:
    enabled: true
    server-url: ${SWAGGER_SERVER_URL:http://localhost:8082}
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env

logging:
  level:
    root: INFO
    com.carecode: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.stat: DEBUG
    com.carecode.core.monitoring: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
